services:
  doc-converter:
    build:
      context: .
      dockerfile_inline: |
        FROM php:8.2-apache

        # Dépendances système nécessaires à l'installeur Calibre (fournit ebook-convert)
        # + libzip-dev pour l'extension PHP zip (lecture/écriture CBZ)
        # + unar pour l'extraction des CBR (RAR), unzip en secours
        RUN apt-get update && apt-get install -y --no-install-recommends \
            wget \
            xz-utils \
            ca-certificates \
            python3 \
            fontconfig \
            libopengl0 \
            libegl1 \
            libxcb-cursor0 \
            libxkbcommon0 \
            libnss3 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libasound2 \
            libzip-dev \
            unzip \
            unar \
            libpng-dev \
            libjpeg62-turbo-dev \
            libwebp-dev \
            librsvg2-bin \
            imagemagick \
            potrace \
            && docker-php-ext-configure gd --with-jpeg --with-webp \
            && docker-php-ext-install gd zip \
            && rm -rf /var/lib/apt/lists/*

        # Installation de Calibre (ebook-convert)
        RUN wget -nv -O- https://download.calibre-ebook.com/linux-installer.sh | sh /dev/stdin install_dir=/opt

        RUN mkdir -p /var/www/html/uploads /var/www/html/output /var/www/html/uploads/cbz_work \
            && chown -R www-data:www-data /var/www/html/uploads /var/www/html/output

        RUN a2enmod rewrite headers

        # Durcissement ImageMagick : ne désactive QUE les coders jamais utilisés par Metamorph
        # (délégués Ghostscript/PS/PDF, MSL, accès réseau, etc. — connus pour des CVE d'exécution
        # de code). PSD/PNG/JPEG/GIF/WEBP restent pleinement autorisés. Les règles ajoutées en fin
        # de fichier priment sur celles définies plus haut (ImageMagick applique la dernière
        # correspondance), donc c'est sûr même si des règles par défaut existent déjà.
        RUN POLICY_FILE=$(find /etc -iname "policy.xml" -path "*ImageMagick*" | head -1) && \
            for pattern in PS PS2 PS3 EPS PDF XPS MVG MSL TEXT SHOW WIN PLT URL HTTPS HTTP EPHEMERAL; do \
              sed -i "/<\/policymap>/i\\  <policy domain=\"coder\" rights=\"none\" pattern=\"$pattern\" />" "$POLICY_FILE"; \
            done

        # Interdit l'accès HTTP direct à uploads/ et output/ : ces dossiers sont dans le
        # DocumentRoot (nécessaire pour que le montage de volume fonctionne simplement), mais
        # tout téléchargement légitime passe déjà par index.php/comicinfo.php/thumb.php, qui
        # valident le nom de fichier — un accès direct par URL devinée ne devrait jamais marcher.
        RUN { \
              echo '<Directory "/var/www/html/uploads">'; \
              echo '    Require all denied'; \
              echo '</Directory>'; \
              echo '<Directory "/var/www/html/output">'; \
              echo '    Require all denied'; \
              echo '</Directory>'; \
              echo ''; \
              echo 'Header always set X-Content-Type-Options "nosniff"'; \
              echo 'Header always set X-Frame-Options "DENY"'; \
              echo 'Header always set Referrer-Policy "strict-origin-when-cross-origin"'; \
            } > /etc/apache2/conf-available/metamorph-hardening.conf \
            && a2enconf metamorph-hardening

        # Augmente les limites d'upload PHP (par défaut 8 Mo, insuffisant pour des PDF/EPUB)
        RUN { \
              echo 'upload_max_filesize = 200M'; \
              echo 'post_max_size = 200M'; \
              echo 'memory_limit = 256M'; \
              echo 'max_execution_time = 300'; \
            } > /usr/local/etc/php/conf.d/uploads.ini

        WORKDIR /var/www/html
    container_name: doc-converter
    ports:
      - "8090:80"
    volumes:
      - ./www:/var/www/html
      - ./uploads:/var/www/html/uploads
      - ./output:/var/www/html/output
    restart: unless-stopped
